name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: speech_synthesize
          MYSQL_USER: speech_app
          MYSQL_PASSWORD: speech_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install speech runtime
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[api,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        env:
          SPEECH_DB_HOST: 127.0.0.1
          SPEECH_DB_PORT: 3306
          SPEECH_DB_NAME: speech_synthesize
          SPEECH_DB_USER: speech_app
          SPEECH_DB_PASSWORD: speech_test
        run: pytest
