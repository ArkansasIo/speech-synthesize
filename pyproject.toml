[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-synthesize"
version = "0.1.0"
description = "Extensible local speech-synthesis library and CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ArkansasIo" }]
dependencies = ["pyttsx3>=2.90"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
speech-synthesize = "speech_synthesize.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
