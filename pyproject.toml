[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-synthesize"
version = "0.2.0"
description = "Extensible local speech-synthesis library, API, CLI, and MySQL job registry"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ArkansasIo" }]
dependencies = [
  "pyttsx3>=2.90",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
speech-synthesize = "speech_synthesize.cli:main"
speech-synthesize-api = "speech_synthesize.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
