[database]
engine = "mysql"
host = "127.0.0.1"
port = 3306
name = "speech_synthesize"
user = "speech_app"
password_env = "SPEECH_DB_PASSWORD"
charset = "utf8mb4"
collation = "utf8mb4_0900_ai_ci"
connect_timeout_seconds = 10
pool_size = 5
max_overflow = 10

[english]
language = "en-US"
locale = "en_US"
encoding = "utf-8"
default_voice = ""
default_rate = 180
default_volume = 1.0

[engine]
backend = "pyttsx3"
output_format = "wav"
max_text_characters = 100000

# Never store real database passwords in this file.
# Set SPEECH_DB_PASSWORD in the process environment.
